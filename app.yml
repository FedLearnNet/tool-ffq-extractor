info:
  name: FFQ Extractor - Tool
  slug: tool-ffq-extractor
  type: EXTRACTOR
  shortDescription: Convert FFQ Excel (or a ZIP of many) into microbiome Nutrition CSV rows.
  longDescription: >
    EXTRACTOR tool that turns food-frequency questionnaire Excel workbooks into a flat
    Nutrition CSV. Accepts a single .xlsx or a .zip of many per-patient workbooks.
    Outputs nutrition_csv.
  sourceUrl: https://github.com/FedLearnNet/ffq-extractor
config:
  hyperparams:
    - name: workers
      type: INTEGER
      description: Process-pool size for ZIP batch extraction (ignored for a single .xlsx).
      default: 4
      minValue: 1
      maxValue: 64
    - name: sheet
      type: STRING
      description: >
        Worksheet name containing the FFQ matrix. Leave empty to use the first sheet.
      default: ""
    - name: date_cell
      type: STRING
      description: Excel cell (A1-style) holding the questionnaire date.
      default: A1
    - name: patient_id_cell
      type: STRING
      description: Excel cell (A1-style) holding the unique patient ID.
      default: A3
  input:
    - name: ffq_archive
      type: PATH
      required: true
      description: >
        A filled FFQ .xlsx workbook, or a .zip archive containing many
        per-patient FFQ Excel files (nested folders allowed).
  output:
    - name: nutrition_csv
      type: CSV
      description: Combined Nutrition rows (one row per marked food item).
      hasHeader: true
      delimiter: ","
